version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-static:/app/static
    environment:
      - DATABASE_URL=sqlite:///./app/static/agriguardian.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  backend-static:
